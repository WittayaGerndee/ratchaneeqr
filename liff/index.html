<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>เช็คการส่งงาน</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #0f172a; --muted: #64748b; --faint: #94a3b8; --line: #e2e8f0;
    --accent: #00a651; --accent-weak: #e7f7ee; --warn: #b45309; --warn-weak: #fef3c7; --bad: #dc2626; --bad-weak: #fee2e2;
    --radius: 16px; --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 'IBM Plex Sans Thai', system-ui, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: .85rem; } .xs { font-size: .75rem; }
  .row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .grow { flex: 1; min-width: 0; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* header */
  .appbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); }
  .appbar .school { font-weight: 700; font-size: 1.02rem; line-height: 1.25; }
  .appbar .by { font-size: .8rem; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; padding: 4px 10px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .pill.ok { background: var(--accent-weak); color: var(--accent); } .pill.wait { background: var(--warn-weak); color: var(--warn); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  main { max-width: 640px; margin: 0 auto; padding: 14px 14px 0; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  h2 { font-size: 1.15rem; margin: 0 0 10px; } h3 { font-size: 1rem; margin: 0 0 8px; }

  /* buttons & fields */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 10px 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .btn:active { transform: scale(.98); } .btn:disabled { opacity: .5; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--bad); } .btn.ghost { border-color: transparent; background: transparent; }
  .btn.block { width: 100%; } .btn.lg { min-height: 52px; font-size: 1.05rem; } .btn.sm { min-height: 34px; padding: 6px 10px; font-size: .85rem; border-radius: 10px; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 4px; }
  .input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: #fff; min-height: 46px; outline: none; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  textarea.input { min-height: 140px; font-family: ui-monospace, monospace; font-size: .85rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* lists */
  .list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: 0; }
  .tap { cursor: pointer; } .tap:active { background: var(--bg); }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .badge { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .badge.warn { background: var(--warn-weak); color: var(--warn); } .badge.off { background: #f1f5f9; color: var(--faint); }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }

  /* scan */
  .task-head .name { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
  .count { font-size: 2rem; font-weight: 700; line-height: 1; letter-spacing: -.5px; }
  .count small { font-size: 1rem; color: var(--muted); font-weight: 500; }
  .stage { position: relative; background: #0b1220; border-radius: 20px; overflow: hidden; aspect-ratio: 1 / 1; margin-bottom: 12px; }
  #reader { position: absolute; inset: 0; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  #reader img[alt="Info icon"], #reader__dashboard, #reader__header_message { display: none !important; }
  .frame { position: absolute; inset: 15%; border-radius: 18px; pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(11,18,32,.35); outline: 3px solid rgba(255,255,255,.9); outline-offset: -3px; transition: outline-color .15s; }
  .stage.flash-ok .frame { outline-color: #22c55e; } .stage.flash-dup .frame { outline-color: #f59e0b; } .stage.flash-err .frame { outline-color: #ef4444; }
  .stage-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #e2e8f0; text-align: center; padding: 20px; }
  .stage-msg svg { width: 44px; height: 44px; }
  .stage-chip { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,.6); color: #fff; font-size: .8rem; padding: 5px 12px; border-radius: 99px; white-space: nowrap; }
  .result { position: absolute; left: 12px; right: 12px; bottom: 12px; border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center;
    background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.25); transform: translateY(0); transition: transform .2s, opacity .2s; }
  .result.gone { transform: translateY(20px); opacity: 0; pointer-events: none; }
  .result .ic { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .result .ic svg { width: 24px; height: 24px; }
  .result.ok .ic { background: var(--accent); color: #fff; } .result.dup .ic { background: #f59e0b; color: #fff; } .result.err .ic { background: var(--bad); color: #fff; }
  .result .t { font-weight: 700; font-size: 1.1rem; line-height: 1.25; } .result .s { font-size: .82rem; color: var(--muted); }
  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .controls .btn { flex-direction: column; gap: 2px; font-size: .78rem; font-weight: 500; min-height: 58px; padding: 6px; }
  .controls .btn.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
  .log .list-item { padding: 9px 0; }
  .log .st { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .log .st svg { width: 16px; height: 16px; }
  .log .st.ok { background: var(--accent-weak); color: var(--accent); } .log .st.dup { background: var(--warn-weak); color: var(--warn); }
  .log .st.err { background: var(--bad-weak); color: var(--bad); } .log .st.undone { background: var(--bg); color: var(--faint); }
  .log .undone .grow { text-decoration: line-through; opacity: .5; }

  /* summary */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 1.6rem; line-height: 1.1; } .stat span { font-size: .75rem; color: var(--muted); }
  .stat.ok b { color: var(--accent); } .stat.bad b { color: var(--bad); }
  .room-title { font-weight: 600; margin: 14px 0 4px; display: flex; justify-content: space-between; }
  .name-line { padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
  .name-line:last-child { border-bottom: 0; }
  details summary { cursor: pointer; font-weight: 600; padding: 8px 0; }

  /* bottom nav */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 8px; color: var(--faint); text-decoration: none; font-size: .7rem; font-weight: 500; }
  .tabbar a svg { width: 24px; height: 24px; }
  .tabbar a.active { color: var(--accent); }

  /* sheet (modal) */
  .sheet-bg { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow: auto; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .5; } }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: -6px auto 12px; }

  .toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 60; max-width: 92vw;
    background: var(--text); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: .9rem; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .toast.err { background: var(--bad); } .toast.warn { background: #92400e; }

  /* QR stickers */
  .sticker-sheet { display: grid; gap: 4mm; }
  .sticker { border: 1px dashed #cbd5e1; border-radius: 6px; padding: 2mm; text-align: center; background: #fff; break-inside: avoid; overflow: hidden; }
  .sticker .q img, .sticker .q canvas { width: 100% !important; height: auto !important; display: block; }
  .sticker .sid { font-weight: 700; line-height: 1.1; margin-top: 1mm; }
  .sticker .nm { line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sticker .cl { color: #475569; line-height: 1.1; }
  @media print {
    body { background: #fff; padding: 0; }
    .appbar, .tabbar, .no-print, .toast { display: none !important; }
    main { max-width: none; padding: 0; }
    section { display: none !important; } #view-qr { display: block !important; }
    .card { box-shadow: none; padding: 0; margin: 0; }
    @page { size: A4; margin: 8mm; }
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="row between">
    <div class="grow">
      <div class="school ellipsis" id="schoolName">เช็คการส่งงาน</div>
      <div class="by ellipsis" id="byLine">กำลังเชื่อมต่อ…</div>
    </div>
    <span class="pill hidden" id="syncPill"><span class="dot"></span><span id="syncText"></span></span>
    <button class="btn ghost sm hidden" id="settingsBtn" aria-label="ตั้งค่า"><svg><use href="#i-gear"/></svg></button>
  </div>
</header>

<main>
  <!-- ไม่มีสิทธิ์ -->
  <section id="view-denied" class="hidden">
    <div class="card" style="text-align:center;padding:28px 18px">
      <svg style="width:48px;height:48px;color:var(--faint)"><use href="#i-lock"/></svg>
      <h2 style="margin-top:10px">สำหรับครูเท่านั้น</h2>
      <p class="muted small">ส่งรหัสด้านล่างให้ผู้ดูแลระบบ เพื่อเพิ่มสิทธิ์ในแผ่น Teachers</p>
      <div class="row"><input class="input grow" id="myUserId" readonly style="font-family:monospace;font-size:.8rem"><button class="btn" id="copyId">คัดลอก</button></div>
    </div>
  </section>

  <!-- ===== สแกน ===== -->
  <section id="view-scan" class="hidden">
    <div id="pickTask">
      <div class="row between" style="margin:4px 2px 10px"><h2 style="margin:0">เลือกงานที่จะตรวจ</h2>
        <button class="btn sm primary" data-new-task><svg><use href="#i-plus"/></svg>งานใหม่</button></div>
      <div id="taskCards"></div>
    </div>

    <div id="scanner" class="hidden">
      <div class="card task-head">
        <div class="row between" style="align-items:flex-start">
          <div class="grow">
            <div class="muted small ellipsis" id="tSub"></div>
            <div class="name" id="tName"></div>
          </div>
          <button class="btn sm" id="changeTask">เปลี่ยนงาน</button>
        </div>
        <div class="row between" style="margin-top:12px;align-items:flex-end">
          <div class="count" id="tCount">0<small> / 0</small></div>
          <div class="small muted" id="tLeft"></div>
        </div>
        <div class="bar" style="margin-top:8px"><i id="tBar" style="width:0"></i></div>
      </div>

      <div class="stage" id="stage">
        <div id="reader"></div>
        <div class="frame hidden" id="frame"></div>
        <div class="stage-chip hidden" id="chip">ส่องกล้องไปที่ QR บนสมุด</div>
        <div class="stage-msg" id="stageMsg">
          <svg><use href="#i-scan"/></svg>
          <div id="stageText">แตะเพื่อเปิดกล้อง</div>
          <button class="btn primary" id="startCamBtn"><svg><use href="#i-play"/></svg>เริ่มสแกน</button>
          <div id="camFallback" class="hidden" style="display:grid;gap:8px;width:100%;max-width:280px">
            <button class="btn primary" id="openExternal">เปิดใน Chrome / Safari (สแกนต่อเนื่อง)</button>
            <button class="btn" id="lineScanBtn">ใช้ตัวสแกนของ LINE</button>
          </div>
        </div>
        <div class="result gone" id="result"><div class="ic" id="rIc"></div><div class="grow"><div class="t ellipsis" id="rT"></div><div class="s ellipsis" id="rS"></div></div></div>
      </div>

      <div class="controls">
        <button class="btn" id="camToggle"><svg><use href="#i-pause"/></svg><span>หยุดกล้อง</span></button>
        <button class="btn" id="torchBtn" disabled><svg><use href="#i-flash"/></svg><span>ไฟฉาย</span></button>
        <button class="btn" id="typeBtn"><svg><use href="#i-keyboard"/></svg><span>พิมพ์รหัส</span></button>
      </div>
      <div class="card hidden" id="typeCard" style="padding:12px">
        <div class="row"><input class="input grow" id="typeInput" placeholder="รหัสนักเรียน" inputmode="numeric" enterkeyhint="go" autocomplete="off">
          <button class="btn primary" id="typeGo">บันทึก</button></div>
      </div>

      <div class="card log hidden" id="logCard">
        <div class="row between"><h3 style="margin:0">ล่าสุด</h3><span class="small muted" id="logCount"></span></div>
        <div id="logList"></div>
      </div>
    </div>
  </section>

  <!-- ===== สรุป ===== -->
  <section id="view-summary" class="hidden">
    <div class="card">
      <div class="row"><select class="input grow" id="sumSel"></select>
        <button class="btn" id="sumRefresh" aria-label="โหลดใหม่"><svg><use href="#i-refresh"/></svg></button></div>
      <div id="sumBox"></div>
    </div>
  </section>

  <!-- ===== งาน ===== -->
  <section id="view-tasks" class="hidden">
    <div class="row between" style="margin:4px 2px 10px"><h2 style="margin:0">งานทั้งหมด</h2>
      <button class="btn sm primary" data-new-task><svg><use href="#i-plus"/></svg>งานใหม่</button></div>
    <div class="card" style="padding:4px 16px"><div id="taskList"></div></div>
  </section>

  <!-- ===== นักเรียน ===== -->
  <section id="view-students" class="hidden">
    <div class="row between" style="margin:4px 2px 10px"><h2 style="margin:0">นักเรียน <span class="muted small" id="stuCount"></span></h2>
      <div class="row" style="gap:6px"><button class="btn sm" id="stuImport">วางจาก Excel</button>
      <button class="btn sm primary" id="stuAdd"><svg><use href="#i-plus"/></svg>เพิ่ม</button></div></div>
    <div class="card" style="padding:12px 16px 4px">
      <div class="row"><select class="input" style="max-width:42%" id="stuClass"></select><input class="input grow" id="stuSearch" placeholder="ค้นหารหัส / ชื่อ"></div>
      <div id="stuList"></div>
    </div>
  </section>

  <!-- ===== พิมพ์ QR ===== -->
  <section id="view-qr" class="hidden">
    <div class="card no-print">
      <h2>พิมพ์สติกเกอร์ QR ติดสมุด</h2>
      <div class="grid2">
        <label class="field"><span>ห้อง</span><select class="input" id="qrClass"></select></label>
        <label class="field"><span>ขนาด</span><select class="input" id="qrSize">
          <option value="30">เล็ก 3 ซม. · 5 ดวง/แถว</option>
          <option value="38" selected>กลาง 3.8 ซม. · 4 ดวง/แถว</option>
          <option value="50">ใหญ่ 5 ซม. · 3 ดวง/แถว</option></select></label>
      </div>
      <button class="btn primary block lg" id="qrPrint"><svg><use href="#i-print"/></svg>พิมพ์ / บันทึกเป็น PDF</button>
      <p class="small muted" id="qrHint" style="margin:10px 0 0"></p>
    </div>
    <div class="card"><div class="sticker-sheet" id="qrSheet"></div></div>
  </section>
</main>

<nav class="tabbar hidden no-print" id="tabbar">
  <a href="#" data-view="scan" class="active"><svg><use href="#i-scan"/></svg>สแกน</a>
  <a href="#" data-view="summary"><svg><use href="#i-chart"/></svg>สรุป</a>
  <a href="#" data-view="tasks"><svg><use href="#i-list"/></svg>งาน</a>
  <a href="#" data-view="students"><svg><use href="#i-users"/></svg>นักเรียน</a>
  <a href="#" data-view="qr"><svg><use href="#i-qr"/></svg>พิมพ์ QR</a>
</nav>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<!-- icons -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6.5 6.5 0 0 0-4-6"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6v8M12 18.5h.01"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></symbol>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
/* ============================================================
   RatchaneeQR — หน้า LIFF สำหรับครู
   - โหลดข้อมูลครั้งเดียว (cache ในเครื่อง) → สแกนแล้วตรวจผลบนมือถือทันที
   - บันทึกขึ้น Google Sheet เป็นชุดเบื้องหลัง (คิวเก็บในเครื่อง กันหาย)
   - เรียก API ซ้ำอัตโนมัติ + reqId กันบันทึกซ้ำ
   ============================================================ */
var CFG = window.APP_CONFIG || {};
var LS_DATA = 'rq_data_v3', LS_QUEUE = 'rq_queue_v2';
var STATE = { idToken: '', view: 'scan', task: null, log: [], camWanted: false };
var DATA = null, BY_ID = {}, QUEUE = [];

/* ---------------- helpers ---------------- */
function $(id) { return document.getElementById(id); }
function show(el, on) { (typeof el === 'string' ? $(el) : el).classList.toggle('hidden', on === false); }
function hide(el) { show(el, false); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
/** รหัสสำหรับเปรียบเทียบ (ตรงกับ server): ไม่สนตัวพิมพ์ และตัวเลขล้วนไม่สนเลข 0 นำหน้า */
function norm(v) {
  var s = String(v == null ? '' : v).trim().toUpperCase();
  return /^\d+$/.test(s) ? s.replace(/^0+(?=\d)/, '') : s;
}
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function pad(n) { return ('0' + n).slice(-2); }
function hhmmss(d) { d = new Date(d); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function thDate(iso) {
  if (!iso) return '-';
  var d = new Date(iso);
  if (isNaN(d)) return '-';
  return d.getDate() + '/' + (d.getMonth() + 1) + '/' + String(d.getFullYear() + 543).slice(2) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function localInput(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return isNaN(d) ? '' : d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function natCmp(a, b) { return String(a).localeCompare(String(b), 'th', { numeric: true }); }
function icon(id) { return '<svg><use href="#i-' + id + '"/></svg>'; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

var toastTimer;
function toast(msg, kind, ms) {
  $('toastHost').innerHTML = msg ? '<div class="toast ' + (kind || '') + '">' + esc(msg) + '</div>' : '';
  clearTimeout(toastTimer);
  if (msg) toastTimer = setTimeout(function () { $('toastHost').innerHTML = ''; }, ms || 2600);
}

/* ---------------- bottom sheet ---------------- */
function openSheet(html, onMount) {
  $('sheetHost').innerHTML = '<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog"><div class="grab"></div>' + html + '</div></div>';
  $('sheetBg').addEventListener('click', function (e) { if (e.target.id === 'sheetBg') closeSheet(); });
  if (onMount) onMount($('sheetHost').querySelector('.sheet'));
}
function closeSheet() { $('sheetHost').innerHTML = ''; }
function confirmSheet(title, text, okLabel, danger) {
  return new Promise(function (resolve) {
    openSheet('<h2>' + esc(title) + '</h2><p class="muted">' + esc(text) + '</p><div class="grid2"><button class="btn" id="cfNo">ยกเลิก</button>' +
      '<button class="btn primary" id="cfYes"' + (danger ? ' style="background:var(--bad);border-color:var(--bad)"' : '') + '>' + esc(okLabel) + '</button></div>',
      function () {
        $('cfNo').onclick = function () { closeSheet(); resolve(false); };
        $('cfYes').onclick = function () { closeSheet(); resolve(true); };
      });
  });
}

/* ---------------- API (ลองใหม่อัตโนมัติ) ----------------
   Google Apps Script บางครั้งค้าง 20–30 วินาทีแล้วตอบหน้า error ทั้งที่รันคำสั่งไปแล้ว
   - ถ้า 3 วินาทียังไม่ตอบ ยิงคำขอเดิม (reqId เดิม) คู่ขนาน (สูงสุด 3 ชุด) ใช้คำตอบแรกที่ได้
   - server ทำงานจริงครั้งเดียวต่อ reqId (คำขอที่ซ้ำจะได้ผลเดิม) จึงไม่บันทึกซ้ำ */
var MAX_TRIES = 6, TIMEOUT_MS = 15000, HEDGE_MS = 3000, MAX_PARALLEL = 3;
var HEDGE = { bootstrap: true, submitBatch: true, undo: true, saveStudent: true, deleteStudent: true, importStudents: true, saveAssignment: true, deleteAssignment: true, saveSettings: true };
function fetchOnce(payload) {
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS) : null;
  return fetch(CFG.API_URL, { method: 'POST', body: payload, signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { return r.text(); })
    .then(function (t) { clearTimeout(timer); try { return JSON.parse(t); } catch (e) { throw new Error('BAD_RESPONSE'); } },
          function (e) { clearTimeout(timer); throw e; });
}
function api(action, data) {
  var body = Object.assign({ action: action, idToken: STATE.idToken, reqId: uid() }, data || {});
  if (!CFG.LIFF_ID) { body.userId = 'DEV_USER'; body.displayName = 'ทดสอบ'; }
  var payload = JSON.stringify(body);
  var p = new Promise(function (resolve, reject) {
    var launched = 0, failed = 0, done = false, hedgeTimer = null;
    function launch() {
      if (done || launched >= MAX_TRIES) return;
      launched++;
      if (launched > 1) setSync('wait', 'กำลังเชื่อมต่อ… (' + launched + ')');
      fetchOnce(payload).then(function (r) {
        if (done) return;
        done = true; clearInterval(hedgeTimer); resolve(r);
      }, function () {
        if (done) return;
        failed++;
        if (launched < MAX_TRIES) setTimeout(launch, HEDGE[action] ? 0 : 600 * failed);
        else if (failed >= launched) { done = true; clearInterval(hedgeTimer); reject(new Error('เชื่อมต่อ Google ไม่สำเร็จ')); }
      });
    }
    launch();
    if (HEDGE[action]) hedgeTimer = setInterval(function () { if (!done && launched - failed < MAX_PARALLEL) launch(); }, HEDGE_MS);
  });
  return p.then(function (res) {
    updateSync();
    if (res.code === 'UNAUTHORIZED' && window.liff && CFG.LIFF_ID && liff.isLoggedIn()) {
      liff.logout(); liff.login({ redirectUri: location.href }); // ID Token หมดอายุ
      return new Promise(function () {});
    }
    return res;
  }, function (err) { updateSync(); throw err; });
}
/** แจ้งเมื่อลองครบแล้วยังไม่สำเร็จ — คำสั่งอาจบันทึกไปแล้ว จึงโหลดข้อมูลล่าสุดให้ */
function netError(e) {
  toast((e && e.message || 'เชื่อมต่อไม่สำเร็จ') + ' — กำลังโหลดข้อมูลล่าสุด', 'warn', 4000);
  refresh().catch(function () {});
}

/* ---------------- ข้อมูล ---------------- */
function setData(d) {
  var subs = {};
  Object.keys(d.subs || {}).forEach(function (aid) {
    var m = subs[norm(aid)] = {};
    Object.keys(d.subs[aid]).forEach(function (sid) { m[norm(sid)] = d.subs[aid][sid]; });
  });
  DATA = {
    students: d.students || [], assignments: d.assignments || [], subs: subs,
    school: d.school || '', adminName: d.adminName || '', user: d.user || {}, studentPrefix: d.studentPrefix || 'STU-'
  };
  QUEUE.forEach(function (q) { // รายการที่ยังไม่ขึ้น server ต้องยังแสดงว่าส่งแล้ว
    var m = subsOf(q.assignmentId);
    if (!m[norm(q.studentId)]) m[norm(q.studentId)] = [q.ts, null, false];
  });
  BY_ID = {};
  DATA.students.forEach(function (s) {
    var room = s[3] == null ? '' : String(s[3]);
    BY_ID[norm(s[0])] = { id: String(s[0]), name: s[1], cls: String(s[2] || ''), room: room, className: room !== '' ? s[2] + '/' + room : String(s[2] || '') };
  });
  lsSet(LS_DATA, DATA);
  if (STATE.task) STATE.task = findTask(STATE.task.assignment_id) || STATE.task;
  renderHeader();
  renderCurrent();
}
function saveLocal() { lsSet(LS_DATA, DATA); }
function refresh() {
  return api('bootstrap').then(function (r) {
    if (!r.ok) { toast(r.message, 'err'); return r; }
    if (r.user && r.user.isTeacher) setData(r);
    return r;
  });
}
function findTask(id) { return DATA.assignments.filter(function (a) { return norm(a.assignment_id) === norm(id); })[0] || null; }
function openTasks() { return DATA.assignments.filter(function (a) { return a.status === 'OPEN'; }); }
function students() { return Object.keys(BY_ID).map(function (k) { return BY_ID[k]; }); }
function classNames() {
  var set = {};
  students().forEach(function (s) { if (s.className) set[s.className] = true; });
  return Object.keys(set).sort(natCmp);
}
function levels() {
  var set = {};
  students().forEach(function (s) { if (s.cls) set[s.cls] = true; });
  return Object.keys(set).sort(natCmp);
}
function isTarget(a, s) {
  var t = String(a.class_target || 'ALL').trim();
  if (!t || norm(t) === 'ALL' || t === 'ทั้งหมด') return true;
  return t.split(/[,;]/).some(function (x) { x = norm(x); return x && (x === norm(s.cls) || x === norm(s.className)); });
}
function targetsOf(a) { return students().filter(function (s) { return isTarget(a, s); }); }
function subsOf(aid) { return DATA.subs[norm(aid)] = DATA.subs[norm(aid)] || {}; }
function progressOf(a) {
  var m = subsOf(a.assignment_id), t = targetsOf(a);
  return { target: t.length, done: t.filter(function (s) { return m[norm(s.id)]; }).length };
}
function targetLabel(a) { var t = a.class_target || 'ALL'; return t === 'ALL' ? 'ทุกห้อง' : t; }
function parseStudent(raw) {
  var s = String(raw || '').trim();
  if (/^https?:\/\//i.test(s)) { var m = s.match(/[?&](student|stu)=([^&#]+)/); return m ? decodeURIComponent(m[2]) : ''; }
  var p = String(DATA.studentPrefix || 'STU-').toUpperCase();
  if (p && s.toUpperCase().indexOf(p) === 0) return s.substring(p.length).trim();
  var m2 = s.match(/^STU-?(.+)$/i);
  return m2 ? m2[1].trim() : s;
}

/* ---------------- header / sync ---------------- */
function renderHeader() {
  $('schoolName').textContent = DATA.school || 'เช็คการส่งงาน';
  var who = (DATA.user && DATA.user.teacherName) || DATA.adminName || (DATA.user && DATA.user.displayName) || '';
  $('byLine').textContent = who ? 'โดย ' + who : '';
  show('settingsBtn', !!(DATA.user && DATA.user.isAdmin));
}
function setSync(kind, text) {
  show('syncPill');
  $('syncPill').className = 'pill ' + (kind === 'ok' ? 'ok' : 'wait');
  $('syncText').textContent = text;
}
function updateSync() {
  if (!DATA) return;
  if (QUEUE.length) setSync('wait', 'รอบันทึก ' + QUEUE.length);
  else setSync('ok', 'บันทึกครบแล้ว');
}

/* ---------------- เสียง / สั่น ---------------- */
var audioCtx = null;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function feedback(kind) {
  try { if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 60 : [70, 50, 70]); } catch (e) {}
  if (!audioCtx) return;
  var tones = kind === 'ok' ? [[1400, 0, .09]] : kind === 'dup' ? [[700, 0, .09], [700, .14, .09]] : [[200, 0, .3]];
  tones.forEach(function (t) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = t[0];
    g.gain.setValueAtTime(.3, audioCtx.currentTime + t[1]);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + t[1] + t[2]);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + t[1]); o.stop(audioCtx.currentTime + t[1] + t[2] + .02);
  });
}

/* =====================================================
   สแกน
   ===================================================== */
function renderTaskCards() {
  var list = openTasks();
  $('taskCards').innerHTML = list.length ? list.map(function (a) {
    var p = progressOf(a), pct = p.target ? Math.round(p.done / p.target * 100) : 0;
    return '<div class="card tap" data-pick="' + esc(a.assignment_id) + '" style="padding:14px 16px">' +
      '<div class="row between"><div class="grow"><div style="font-weight:600" class="ellipsis">' + esc(a.assignment_name) + '</div>' +
      '<div class="small muted ellipsis">' + esc(a.subject) + ' · ' + esc(targetLabel(a)) + (a.due_date ? ' · ส่ง ' + esc(thDate(a.due_date)) : '') + '</div></div>' +
      '<div style="text-align:right"><b>' + p.done + '</b><span class="muted">/' + p.target + '</span>' + (a.is_overdue ? '<div><span class="badge warn">เลยกำหนด</span></div>' : '') + '</div></div>' +
      '<div class="bar" style="margin-top:10px"><i style="width:' + pct + '%"></i></div></div>';
  }).join('') : '<div class="card empty">ยังไม่มีงานที่เปิดรับ<br><button class="btn primary" style="margin-top:12px" data-new-task>' + icon('plus') + 'สร้างงานแรก</button></div>';
}
$('taskCards').addEventListener('click', function (e) {
  var c = e.target.closest('[data-pick]');
  if (c) selectTask(c.dataset.pick, true);
});

function selectTask(aid, userGesture) {
  var a = findTask(aid);
  if (!a) { toast('ไม่พบงานนี้', 'err'); return; }
  if (a.status !== 'OPEN') { toast('งานนี้ปิดรับแล้ว', 'warn'); return; }
  STATE.task = a;
  STATE.log = STATE.log.filter(function (e) { return norm(e.aid) === norm(a.assignment_id); });
  hide('pickTask'); show('scanner');
  $('tSub').textContent = a.subject + ' · ' + targetLabel(a) + (a.due_date ? ' · กำหนดส่ง ' + thDate(a.due_date) : '');
  $('tName').textContent = a.assignment_name;
  hideResult();
  if (userGesture) STATE.camWanted = true;
  go('scan'); // เปิดกล้องอัตโนมัติถ้าครูเคยเปิดไว้ / เพิ่งแตะเลือกงาน
}
$('changeTask').onclick = function () {
  stopCam(true); STATE.task = null;
  show('pickTask'); hide('scanner'); renderTaskCards();
};
function renderProgress() {
  var p = progressOf(STATE.task);
  $('tCount').innerHTML = p.done + '<small> / ' + p.target + '</small>';
  $('tLeft').textContent = p.target - p.done > 0 ? 'เหลือ ' + (p.target - p.done) + ' คน' : (p.target ? 'ครบทุกคนแล้ว 🎉' : '');
  $('tBar').style.width = (p.target ? Math.round(p.done / p.target * 100) : 0) + '%';
}

/* ---- กล้อง: เปิดค้างไว้ สแกนต่อเนื่อง ---- */
var cam = null, camOn = false, camBusy = false, lastText = '', lastAt = 0, holdUntil = 0, torchOn = false;

function stageState(kind, text) {
  // kind: idle | starting | live | error
  show('stageMsg', kind !== 'live');
  show('frame', kind === 'live'); show('chip', kind === 'live');
  show('startCamBtn', kind === 'idle');
  show('camFallback', kind === 'error');
  $('stageText').textContent = text || '';
  $('camToggle').innerHTML = kind === 'live' ? icon('pause') + '<span>หยุดกล้อง</span>' : icon('play') + '<span>เปิดกล้อง</span>';
}
stageState('idle', 'แตะเพื่อเปิดกล้อง');

function startCam() {
  if (camOn || camBusy) return;
  camBusy = true;
  STATE.camWanted = true;
  stageState('starting', 'กำลังเปิดกล้อง…');
  try {
    cam = cam || new Html5Qrcode('reader', {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
  } catch (e) { camBusy = false; camFailed(e); return; }
  cam.start({ facingMode: 'environment' }, {
    fps: 20, aspectRatio: 1, disableFlip: true,
    qrbox: function (w, h) { var m = Math.floor(Math.min(w, h) * 0.7); return { width: m, height: m }; }
  }, onDecoded, function () {}).then(function () {
    camOn = true; camBusy = false;
    // ถ้าผู้ใช้เปลี่ยนหน้าไประหว่างเปิดกล้อง ให้ปิดทันที
    if (STATE.view !== 'scan' || !STATE.task || document.hidden) { stopCam(true); return; }
    stageState('live');
    setupTorch();
  }).catch(function (err) { camBusy = false; camFailed(err); });
}
function stopCam(keepWanted) {
  if (!keepWanted) STATE.camWanted = false;
  $('torchBtn').disabled = true; $('torchBtn').classList.remove('on');
  if (!cam || !camOn) { if (!camBusy) stageState('idle', 'แตะเพื่อเปิดกล้อง'); return; }
  camOn = false; torchOn = false;
  cam.stop().catch(function () {}).then(function () { stageState('idle', 'แตะเพื่อเปิดกล้อง'); });
}
function camFailed(err) {
  STATE.camWanted = false;
  var inLine = !!(window.liff && CFG.LIFF_ID && liff.isInClient());
  stageState(inLine ? 'error' : 'idle', inLine ? 'แอป LINE ไม่อนุญาตให้เปิดกล้องในหน้านี้' : 'เปิดกล้องไม่ได้ — อนุญาตการใช้กล้องแล้วลองใหม่');
  show('lineScanBtn', hasLineScanner());
  if (!inLine) toast(String(err && err.message || err).slice(0, 120), 'err', 4000);
}
function setupTorch() {
  var b = $('torchBtn');
  b.disabled = true;
  try {
    var t = cam.getRunningTrackCameraCapabilities().torchFeature();
    if (t.isSupported()) {
      b.disabled = false;
      b.onclick = function () {
        torchOn = !torchOn;
        t.apply(torchOn).catch(function () {});
        b.classList.toggle('on', torchOn);
      };
    }
  } catch (e) {}
}
$('startCamBtn').onclick = function () { startCam(); };
$('camToggle').onclick = function () { camOn ? stopCam() : startCam(); };
$('openExternal').onclick = function () {
  var url = 'https://liff.line.me/' + CFG.LIFF_ID + (STATE.task ? '?task=' + encodeURIComponent(STATE.task.assignment_id) : '');
  liff.openWindow({ url: url, external: true });
};
function hasLineScanner() {
  return !!(window.liff && CFG.LIFF_ID && liff.isInClient() && liff.isApiAvailable && liff.isApiAvailable('scanCodeV2'));
}
function lineLoop() {
  liff.scanCodeV2().then(function (r) {
    if (!r || !r.value) return;
    handleCode(r.value);
    setTimeout(lineLoop, 250);
  }).catch(function () {});
}
$('lineScanBtn').onclick = lineLoop;
// ปิดกล้องเมื่อออกจากแอป เปิดใหม่เมื่อกลับมา
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { if (camOn) stopCam(true); }

function onDecoded(text) {
  var now = Date.now();
  if (now < holdUntil) return;                          // พักสั้น ๆ หลังแสดงผล
  if (text === lastText && now - lastAt < 2500) return; // เล่มเดิมยังอยู่หน้ากล้อง
  lastText = text; lastAt = now;
  holdUntil = now + 700;
  handleCode(text);
}

function handleCode(text) {
  var task = String(text).match(/[?&]task=([^&#]+)/);
  if (task) { selectTask(decodeURIComponent(task[1])); return; }
  record(text);
}

/** ตรวจผลบนมือถือทันที แล้วเข้าคิวบันทึก */
function record(raw) {
  var a = STATE.task;
  if (!a || !DATA) return;
  var sid = parseStudent(raw), s = BY_ID[norm(sid)];
  var e = { id: uid(), aid: a.assignment_id, time: hhmmss(new Date()), code: sid || String(raw).slice(0, 30) };
  if (!s) {
    e.state = 'err'; e.msg = 'ไม่พบรหัสนี้ในรายชื่อ';
    showResult('err', 'ไม่พบรหัส ' + e.code, 'เพิ่มนักเรียนได้ที่เมนู "นักเรียน"');
  } else if (!isTarget(a, s)) {
    Object.assign(e, { state: 'err', name: s.name, sid: s.id, cls: s.className, msg: 'ไม่ใช่ห้องที่สั่งงานนี้' });
    showResult('err', s.name, 'ห้อง ' + s.className + ' ไม่ได้รับงานนี้');
  } else if (subsOf(a.assignment_id)[norm(s.id)]) {
    var prev = subsOf(a.assignment_id)[norm(s.id)];
    Object.assign(e, { state: 'dup', name: s.name, sid: s.id, cls: s.className, msg: 'ส่งแล้ว ' + thDate(prev[0]) });
    showResult('dup', s.name + ' · ส่งแล้ว', 'บันทึกไว้เมื่อ ' + thDate(prev[0]));
  } else {
    var ts = new Date().toISOString();
    var late = !!(a.due_date && Date.now() > new Date(a.due_date).getTime());
    subsOf(a.assignment_id)[norm(s.id)] = [ts, null, late];
    Object.assign(e, { state: 'ok', name: s.name, sid: s.id, cls: s.className, late: late, pending: true });
    QUEUE.push({ cid: e.id, studentId: s.id, assignmentId: a.assignment_id, ts: ts });
    lsSet(LS_QUEUE, QUEUE); saveLocal();
    showResult('ok', s.name, s.id + ' · ' + s.className + (late ? ' · ส่งช้า' : ''));
    renderProgress();
    scheduleFlush();
  }
  feedback(e.state);
  STATE.log.unshift(e);
  if (STATE.log.length > 300) STATE.log.length = 300;
  renderLog();
}

var resultTimer;

  var r = $('result');
  r.className = 'result ' + kind;
  $('rIc').innerHTML = icon(kind === 'ok' ? 'check' : kind === 'dup' ? 'alert' : 'x');

  st.classList.remove('flash-ok', 'flash-dup', 'flash-err');
  st.classList.add('flash-' + kind);
  clearTimeout(resultTimer);
  resultTimer = setTimeout(function () { st.classList.remove('flash-' + kind); }, 900);
}

$('logList').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-undo]');
  if (!b) return;
  var e = STATE.log.filter(function (x) { return x.id === b.dataset.undo; })[0];
  if (!e) return;
  confirmSheet('ยกเลิกการบันทึก?', e.name + ' (' + e.sid + ') จะกลับเป็น "ยังไม่ส่ง"', 'ยกเลิกการบันทึก', true).then(function (yes) {
    if (!yes) return;
    var done = function () {
      delete subsOf(e.aid)[norm(e.sid)];
      e.state = 'undone'; e.msg = 'ยกเลิกแล้ว';
      saveLocal(); renderLog(); if (STATE.task) renderProgress();
      toast('ยกเลิกแล้ว');
    };
    if (QUEUE.some(function (q) { return q.cid === e.id; })) {
      QUEUE = QUEUE.filter(function (q) { return q.cid !== e.id; });
      lsSet(LS_QUEUE, QUEUE); updateSync(); done();
      return;
    }
    var subId = e.subId || (subsOf(e.aid)[norm(e.sid)] || [])[1];
    if (!subId) { toast('กำลังบันทึกรายการนี้ ลองอีกครั้งในไม่กี่วินาที', 'warn'); return; }
    api('undo', { submissionId: subId }).then(function (r) {
      if (!r.ok && r.code !== 'NOT_FOUND') { toast(r.message, 'err'); return; }
      done();
    }).catch(netError);
  });
});

/* ---- คิวบันทึก: ส่งเป็นชุด ---- */
var flushing = false, flushTimer = null;
function scheduleFlush(delay) {
  updateSync();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, delay == null ? 500 : delay);
}
function flush() {
  if (flushing || !QUEUE.length || !DATA) { updateSync(); return; }
  if (CFG.LIFF_ID && !STATE.idToken) { scheduleFlush(1500); return; } // ยังไม่ได้ล็อกอิน LINE
  flushing = true;
  var batch = QUEUE.slice(0, 80);
  api('submitBatch', { items: batch }).then(function (r) {
    if (!r.ok) throw new Error(r.message || 'บันทึกไม่สำเร็จ');
    var byCid = {};
    r.results.forEach(function (x) { byCid[x.cid] = x; });
    QUEUE = QUEUE.filter(function (q) { return !byCid[q.cid]; });
    lsSet(LS_QUEUE, QUEUE);
    batch.forEach(function (q) {
      var x = byCid[q.cid];
      if (!x) return;
      var e = STATE.log.filter(function (l) { return l.id === q.cid; })[0];
      var m = subsOf(q.assignmentId), k = norm(q.studentId);
      if (x.ok || x.code === 'DUPLICATE') {
        if (m[k]) { m[k][1] = x.submission_id; if (x.ok) m[k][2] = !!x.isLate; }
        if (e) { e.pending = false; e.subId = x.submission_id; if (!x.ok) { e.state = 'dup'; e.msg = 'มีคนบันทึกไว้แล้ว'; } }
      } else {
        delete m[k];
        if (e) { e.state = 'err'; e.pending = false; e.msg = x.message; }
        toast('บันทึกไม่สำเร็จ: ' + (e ? e.name + ' — ' : '') + x.message, 'err', 4500);
        feedback('err');
      }
    });
    saveLocal(); renderLog();
    if (STATE.task) renderProgress();
  }).catch(function () {
    flushing = false;
    scheduleFlush(5000); // ออฟไลน์ / Google ขัดข้อง → ลองใหม่
    return 'retry';
  }).then(function (x) {
    if (x === 'retry') return;
    flushing = false;
    if (QUEUE.length) scheduleFlush(300); else updateSync();
  });
}
window.addEventListener('online', function () { scheduleFlush(0); });

function renderSummary() {
  var list = DATA.assignments;
  if (!list.length) { $('sumSel').innerHTML = ''; $('sumBox').innerHTML = '<div class="empty">ยังไม่มีงาน</div>'; return; }
  var cur = $('sumSel').value || (STATE.task && STATE.task.assignment_id) || (openTasks()[0] || list[0]).assignment_id;
  $('sumSel').innerHTML = list.map(function (a) {
    var p = progressOf(a);
    return '<option value="' + esc(a.assignment_id) + '">' + esc(a.assignment_name + ' · ' + a.subject + ' (' + p.done + '/' + p.target + ')' + (a.status !== 'OPEN' ? ' · ปิดรับ' : '')) + '</option>';
  }).join('');
  var a = findTask(cur) || list[0];
  $('sumSel').value = a.assignment_id;
  var m = subsOf(a.assignment_id);
  var rooms = {};
  targetsOf(a).sort(function (x, y) { return natCmp(x.className, y.className) || natCmp(x.id, y.id); }).forEach(function (s) {
    var r = rooms[s.className] = rooms[s.className] || { miss: [], done: [] };
    (m[norm(s.id)] ? r.done : r.miss).push(s);
  });
  var keys = Object.keys(rooms).sort(natCmp);
  var total = 0, done = 0;
  keys.forEach(function (k) { total += rooms[k].miss.length + rooms[k].done.length; done += rooms[k].done.length; });
  var miss = total - done;

  var html = '<div class="stats"><div class="stat"><b>' + total + '</b><span>ทั้งหมด</span></div><div class="stat ok"><b>' + done + '</b><span>ส่งแล้ว</span></div><div class="stat bad"><b>' + miss + '</b><span>ยังไม่ส่ง</span></div></div>';
  if (keys.length > 1) {
    html += keys.map(function (k) {
      var r = rooms[k], t = r.miss.length + r.done.length, pct = t ? Math.round(r.done.length / t * 100) : 0;
      return '<div style="margin-bottom:8px"><div class="row between small"><span>' + esc(k) + '</span><span class="muted">' + r.done.length + '/' + t + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    }).join('');
  }
  html += '<div class="row between" style="margin-top:16px"><h3 style="margin:0;color:var(--bad)">ยังไม่ส่ง ' + miss + ' คน</h3>' +
    (miss ? '<button class="btn sm" id="copyMissing">' + icon('copy') + 'คัดลอกรายชื่อ</button>' : '') + '</div>';
  html += miss ? keys.filter(function (k) { return rooms[k].miss.length; }).map(function (k) {
    return '<div class="room-title"><span>' + esc(k) + '</span><span class="muted small">' + rooms[k].miss.length + ' คน</span></div>' +
      rooms[k].miss.map(function (s) { return '<div class="name-line"><span class="muted" style="min-width:52px">' + esc(s.id) + '</span><span>' + esc(s.name) + '</span></div>'; }).join('');
  }).join('') : (total ? '<div class="empty" style="color:var(--accent)">ส่งครบทุกคนแล้ว 🎉</div>' : '<div class="empty">ยังไม่มีนักเรียนในห้องที่สั่งงานนี้</div>');
  html += '<details style="margin-top:12px"><summary>ส่งแล้ว ' + done + ' คน</summary>' + keys.map(function (k) {
    return rooms[k].done.map(function (s) {
      var x = m[norm(s.id)];
      return '<div class="name-line"><span class="muted" style="min-width:52px">' + esc(s.id) + '</span><span class="grow">' + esc(s.name) + '</span><span class="xs muted">' + esc(thDate(x[0])) + (x[2] ? ' · ช้า' : '') + '</span></div>';
    }).join('');
  }).join('') + '</details>';
  if (a.status === 'OPEN') html += '<button class="btn primary block lg" style="margin-top:14px" data-scan-task="' + esc(a.assignment_id) + '">' + icon('scan') + 'สแกนงานนี้</button>';
  $('sumBox').innerHTML = html;

  var cp = $('copyMissing');
  if (cp) cp.onclick = function () {
    var text = 'ยังไม่ส่ง: ' + a.assignment_name + ' (' + a.subject + ')\n' + keys.filter(function (k) { return rooms[k].miss.length; }).map(function (k) {
      return '\n' + k + '\n' + rooms[k].miss.map(function (s, i) { return (i + 1) + '. ' + s.id + ' ' + s.name; }).join('\n');
    }).join('\n');
    copyText(text).then(function () { toast('คัดลอกแล้ว — วางในกลุ่ม LINE ได้เลย'); });
  };
}

};
function copyText(t) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove(); return Promise.resolve();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(fallback);
  return fallback();
}

function saveTask(t, startScan) {
  return api('saveAssignment', { assignment: t }).then(function (r) {
    if (!r.ok) { toast(r.message, 'err'); return false; }
    var i = DATA.assignments.findIndex(function (x) { return norm(x.assignment_id) === norm(r.assignment.assignment_id); });
    if (i >= 0) DATA.assignments[i] = r.assignment; else DATA.assignments.push(r.assignment);
    if (STATE.task && norm(STATE.task.assignment_id) === norm(r.assignment.assignment_id)) STATE.task = r.assignment;
    saveLocal();
    if (startScan) { toast('สร้างงานแล้ว'); selectTask(r.assignment.assignment_id, true); }
    else { toast('บันทึกแล้ว'); renderCurrent(); }
    return true;
  }).catch(function (e) { netError(e); return false; });
}

    return '<div class="list-item tap" data-stu="' + esc(s.id) + '"><div class="grow"><div class="ellipsis" style="font-weight:600">' + esc(s.name) + '</div>' +
      '<div class="small muted">' + esc(s.id) + ' · ' + esc(s.className) + '</div></div><span class="faint"><svg style="width:20px;height:20px"><use href="#i-more"/></svg></span></div>';
  }).join('') : '<div class="empty">' + (students().length ? 'ไม่พบนักเรียนที่ค้นหา' : 'ยังไม่มีนักเรียน<br>กด "เพิ่ม" หรือ "วางจาก Excel"') + '</div>';
}
$('stuClass').onchange = renderStudents;
$('stuSearch').oninput = renderStudents;
$('stuAdd').onclick = function () { studentForm(null); };
$('stuList').addEventListener('click', function (e) {
  var r = e.target.closest('[data-stu]');
  if (r) studentForm(BY_ID[norm(r.dataset.stu)]);
});

function studentForm(s) {
  var lv = levels();
  var preset = !s && $('stuClass').value ? $('stuClass').value.split('/') : null;
  openSheet('<h2>' + (s ? 'แก้ไขนักเรียน' : 'เพิ่มนักเรียน') + '</h2><form id="sf">' +
    '<div class="grid2"><label class="field"><span>รหัสนักเรียน *</span><input class="input" name="sid" required autocomplete="off" value="' + esc(s ? s.id : '') + '"></label>' +
    '<label class="field"><span>ชั้น / ห้อง *</span><div class="row" style="gap:6px"><input class="input" name="cls" required list="lvList" placeholder="ป.4" value="' + esc(s ? s.cls : (preset ? preset[0] : (lv[0] || ''))) + '">' +
    '<input class="input" name="room" placeholder="ห้อง" inputmode="numeric" style="max-width:70px" value="' + esc(s ? s.room : (preset ? preset[1] || '' : '')) + '"></div></label></div>' +
    '<datalist id="lvList">' + lv.map(function (l) { return '<option value="' + esc(l) + '">'; }).join('') + '</datalist>' +
    '<label class="field"><span>ชื่อ-สกุล *</span><input class="input" name="name" required autocomplete="off" value="' + esc(s ? s.name : '') + '"></label>' +
    '<button class="btn primary block lg" type="submit">' + (s ? 'บันทึก' : 'บันทึกและเพิ่มคนถัดไป') + '</button>' +
    (s ? '<button class="btn danger block" type="button" id="sDel" style="margin-top:8px">ลบนักเรียนคนนี้</button>' : '') + '</form>', function () {
      var f = $('sf');
      setTimeout(function () { (s ? f.name : f.sid).focus(); }, 250);
      f.onsubmit = function (ev) {
        ev.preventDefault();
        var btn = f.querySelector('[type=submit]'), label = btn.textContent;
        var stu = { student_id: f.sid.value.trim(), name: f.name.value.trim(), class: f.cls.value.trim(), room: f.room.value.trim() };
        var clash = BY_ID[norm(stu.student_id)];
        if (clash && (!s || norm(s.id) !== norm(stu.student_id))) { toast('รหัส ' + stu.student_id + ' เป็นของ ' + clash.name + ' แล้ว', 'err', 3500); return; }
        btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
        api('saveStudent', { student: stu, oldId: s ? s.id : '' }).then(function (r) {
          btn.disabled = false; btn.textContent = label;
          if (!r.ok) { toast(r.message, 'err', 3500); return; }
          DATA.students = DATA.students.filter(function (x) { return norm(x[0]) !== norm(r.student[0]) && (!s || norm(x[0]) !== norm(s.id)); });
          DATA.students.push(r.student);
          setData(DATA);
          if (s) { closeSheet(); toast('บันทึกแล้ว'); }
          else { toast('เพิ่ม ' + r.student[1] + ' แล้ว'); f.sid.value = nextId(r.student[0]); f.name.value = ''; f.name.focus(); }
        }).catch(function (e) { btn.disabled = false; btn.textContent = label; netError(e); });
      };
      if ($('sDel')) $('sDel').onclick = function () {
        confirmSheet('ลบนักเรียน?', s.id + ' ' + s.name + ' (ประวัติการส่งงานเดิมยังอยู่)', 'ลบ', true).then(function (y) {
          if (!y) return;
          api('deleteStudent', { studentId: s.id }).then(function (r) {
            if (!r.ok) { toast(r.message, 'err'); return; }
            DATA.students = DATA.students.filter(function (x) { return norm(x[0]) !== norm(s.id); });
            setData(DATA);
            toast('ลบแล้ว');
          }).catch(netError);
        });
      };
    });
}
/** เดารหัสคนถัดไป (0001 → 0002) เพื่อกรอกเร็วขึ้น */
function nextId(id) {
  var m = String(id).match(/^(.*?)(\d+)$/);
  if (!m) return '';
  var n = String(Number(m[2]) + 1);
  while (n.length < m[2].length) n = '0' + n;
  return BY_ID[norm(m[1] + n)] ? '' : m[1] + n;
}

$('stuImport').onclick = function () {
  openSheet('<h2>วางรายชื่อจาก Excel</h2><p class="small muted" style="margin-top:-4px">คัดลอกคอลัมน์ <b>รหัส · ชื่อ-สกุล · ชั้น · ห้อง</b> (หรือ รหัส · ชื่อ · ป.4/5) แล้ววาง — รหัสที่มีอยู่แล้วจะถูกแก้ให้ตรง</p>' +
    '<textarea class="input" id="impText" placeholder="0001&#9;ด.ช.ใจดี มีโชค&#9;ป.4&#9;5"></textarea>' +
    '<div class="small muted" id="impPrev" style="margin:6px 0 10px"></div>' +
    '<button class="btn primary block lg" id="impGo" disabled>นำเข้า</button>', function () {
      var ta = $('impText');
      setTimeout(function () { ta.focus(); }, 250);
      ta.oninput = function () {
        var n = ta.value.split(/\r?\n/).filter(function (l) { var c = l.split(/\t|,/); return c[0] && c[0].trim() && c[1] && c[1].trim() && !/รหัส|student/i.test(c[0]); }).length;
        $('impPrev').textContent = n ? 'พบ ' + n + ' คน' : '';
        $('impGo').disabled = !n;
      };
      $('impGo').onclick = function () {
        var b = this; b.disabled = true; b.textContent = 'กำลังนำเข้า…';
        api('importStudents', { text: ta.value }).then(function (r) {
          if (!r.ok) { toast(r.message, 'err'); b.disabled = false; b.textContent = 'นำเข้า'; return; }
          DATA.students = r.students;
          setData(DATA);
          closeSheet();
          toast('เพิ่มใหม่ ' + r.added + ' คน · แก้ไข ' + r.updated + ' คน', '', 3500);
        }).catch(function (e) { b.disabled = false; b.textContent = 'นำเข้า'; netError(e); });
      };
    });
};

/* =====================================================
   พิมพ์ QR
   ===================================================== */
function renderQr() {
  var cls = classNames();
  var cur = $('qrClass').value;
  $('qrClass').innerHTML = '<option value="">ทุกห้อง</option>' + cls.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
  $('qrClass').value = cls.indexOf(cur) >= 0 ? cur : (cur === '' && $('qrClass').dataset.touched ? '' : (cls[0] || ''));
  var c = $('qrClass').value, size = Number($('qrSize').value);
  var list = students().filter(function (s) { return !c || s.className === c; }).sort(function (x, y) { return natCmp(x.className, y.className) || natCmp(x.id, y.id); });
  var sheet = $('qrSheet');
  sheet.style.gridTemplateColumns = 'repeat(auto-fill, ' + size + 'mm)';
  var fs = size <= 30 ? 7 : size <= 38 ? 8.5 : 10;
  sheet.innerHTML = list.length ? list.map(function (s, i) {
    return '<div class="sticker" style="width:' + size + 'mm;font-size:' + fs + 'pt"><div class="q" id="qr' + i + '"></div>' +
      '<div class="sid">' + esc(s.id) + '</div><div class="nm">' + esc(s.name) + '</div><div class="cl">' + esc(s.className) + '</div></div>';
  }).join('') : '<div class="empty">ยังไม่มีนักเรียน</div>';
  list.forEach(function (s, i) {
    new QRCode($('qr' + i), { text: (DATA.studentPrefix || 'STU-') + s.id, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
  });
  var inLine = !!(window.liff && CFG.LIFF_ID && liff.isInClient());
  $('qrHint').innerHTML = inLine
    ? 'แอป LINE สั่งพิมพ์ไม่ได้ — ปุ่มด้านบนจะเปิดหน้านี้ใน Chrome/Safari หรือเปิดบนคอมพิวเตอร์ที่ <b>liff.line.me/' + esc(CFG.LIFF_ID) + '?mode=qr</b>'
    : 'ตั้งค่าพิมพ์: กระดาษ A4 · Scale 100% · พิมพ์บนกระดาษสติกเกอร์ หรือกระดาษธรรมดาแล้วติดเทปใส';
}
$('qrClass').onchange = function () { this.dataset.touched = '1'; renderQr(); };
$('qrSize').onchange = renderQr;
$('qrPrint').onclick = function () {
  if (window.liff && CFG.LIFF_ID && liff.isInClient()) { liff.openWindow({ url: 'https://liff.line.me/' + CFG.LIFF_ID + '?mode=qr', external: true }); return; }
  window.print();
};

/* =====================================================
   ตั้งค่า (ผู้ดูแล)
   ===================================================== */
$('settingsBtn').onclick = function () {
  openSheet('<h2>ตั้งค่า</h2><form id="stf">' +
    '<label class="field"><span>ชื่อโรงเรียน</span><input class="input" name="school" value="' + esc(DATA.school) + '"></label>' +
    '<label class="field"><span>ชื่อครู (แสดงบนหัวหน้าจอ)</span><input class="input" name="admin" value="' + esc(DATA.adminName) + '"></label>' +
    '<button class="btn primary block lg" type="submit">บันทึก</button></form>', function () {
      $('stf').onsubmit = function (ev) {
        ev.preventDefault();
        var f = ev.target, b = f.querySelector('[type=submit]');
        b.disabled = true; b.textContent = 'กำลังบันทึก…';
        api('saveSettings', { settings: { SCHOOL_NAME: f.school.value, ADMIN_NAME: f.admin.value } }).then(function (r) {
          if (!r.ok) { toast(r.message, 'err'); b.disabled = false; b.textContent = 'บันทึก'; return; }
          DATA.school = r.school; DATA.adminName = r.adminName;
          if (DATA.user) DATA.user.teacherName = r.adminName || DATA.user.teacherName;
          saveLocal(); renderHeader(); closeSheet(); toast('บันทึกแล้ว');
        }).catch(function (e) { b.disabled = false; b.textContent = 'บันทึก'; netError(e); });
      };
    });
};

/* =====================================================
   นำทาง
   ===================================================== */
var VIEWS = ['scan', 'summary', 'tasks', 'students', 'qr'];
function go(v) {
  if (v !== 'scan' && (camOn || camBusy)) stopCam(true);
  STATE.view = v;
  VIEWS.forEach(function (x) { show('view-' + x, x === v); });
  document.querySelectorAll('.tabbar a').forEach(function (a) { a.classList.toggle('active', a.dataset.view === v); });
  renderCurrent();
  if (v === 'scan' && STATE.task && STATE.camWanted && !camOn) startCam();
  window.scrollTo(0, 0);
}
function renderCurrent() {
  if (!DATA) return;
  if (STATE.view === 'scan') {
    show('pickTask', !STATE.task); show('scanner', !!STATE.task);
    if (STATE.task) { renderProgress(); renderLog(); } else renderTaskCards();
  }
  if (STATE.view === 'summary') renderSummary();
  if (STATE.view === 'tasks') renderTasks();
  if (STATE.view === 'students') renderStudents();
  if (STATE.view === 'qr') renderQr();
}
$('tabbar').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-view]');
  if (!a) return;
  e.preventDefault();
  go(a.dataset.view);
});
$('copyId').onclick = function () { copyText($('myUserId').value).then(function () { toast('คัดลอกแล้ว'); }); };

/** อ่านพารามิเตอร์จาก URL (รวมแบบที่ LINE ห่อไว้ใน liff.state) */
function urlParam(name) {
  var q = new URLSearchParams(location.search);
  var v = q.get(name);
  if (v) return v;
  var m = (q.get('liff.state') || '').match(new RegExp('[?&]' + name + '=([^&#]+)'));
  return m ? decodeURIComponent(m[1]) : '';
}

/* =====================================================
   เริ่มทำงาน
   ===================================================== */
var started = false;
function startApp() {
  if (started) return;
  started = true;
  show('tabbar');
  var mode = urlParam('mode'), task = urlParam('task');
  var view = { summary: 'summary', new: 'tasks', tasks: 'tasks', students: 'students', manage: 'students', qr: 'qr' }[mode] || 'scan';
  go(view);
  if (mode === 'new') taskForm(null);
  if (task && findTask(task)) selectTask(task, false);
}
function denied(r) {
  try { localStorage.removeItem(LS_DATA); } catch (e) {}
  DATA = null;
  hide('tabbar'); VIEWS.forEach(function (x) { hide('view-' + x); });
  $('schoolName').textContent = r.school || 'เช็คการส่งงาน';
  $('byLine').textContent = '';
  hide('syncPill'); hide('settingsBtn');
  $('myUserId').value = r.userId || '';
  show('view-denied');
}

(function boot() {
  if (!CFG.API_URL) { $('byLine').textContent = 'ยังไม่ได้ตั้งค่า API_URL ใน config.js'; return; }
  QUEUE = lsGet(LS_QUEUE) || [];
  var cached = lsGet(LS_DATA);
  // 1) แสดงข้อมูลที่เคยโหลดไว้ทันที (ไม่ต้องรอ LINE / Google)
  if (cached && cached.user && cached.user.isTeacher) {
    setData(cached);
    startApp();
    setSync('wait', 'กำลังอัปเดต');
  }
  // 2) เข้าสู่ระบบ LINE แล้วโหลดข้อมูลล่าสุด
  var login = CFG.LIFF_ID ? liff.init({ liffId: CFG.LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return new Promise(function () {}); }
    STATE.idToken = liff.getIDToken();
  }) : Promise.resolve();
  login.then(function () { return api('bootstrap'); }).then(function (r) {
    if (!r.ok) { toast(r.message, 'err', 5000); return; }
    if (!r.user.isTeacher) { denied(r); return; }
    setData(r);
    startApp();
    scheduleFlush(0);
  }).catch(function (e) {
    if (started) { setSync('wait', 'ออฟไลน์'); scheduleFlush(8000); return; }
    $('byLine').textContent = 'เชื่อมต่อไม่สำเร็จ — ปิดแล้วเปิดใหม่อีกครั้ง';
    toast(e.message, 'err', 5000);
  });
})();
</script>
